<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imagine - Air Notes & Air Drawing Web App</title>
  <link rel="stylesheet" href="styles.css">
  
  <!-- MediaPipe Libraries via CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>

  <!-- jsPDF for PDF Exports -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
  <div class="app-container">
    
    <!-- Apple Notes Sidebar -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <div class="brand-title">
          <div class="brand-icon">✨</div>
          <span>Imagine</span>
        </div>
        <button class="mobile-notes-trigger" id="btnMobileNotes" type="button" aria-controls="notesPanel" aria-expanded="false">
          <i data-lucide="notebook-tabs"></i>
          <span>Notes</span>
          <span class="mobile-note-count" id="mobileNoteCount">0</span>
        </button>
      </div>

      <nav>
        <div class="nav-section-title">Folders</div>
        <ul class="nav-list">
          <li class="nav-item active" data-folder="all">
            <div class="nav-item-left">
              <i data-lucide="folder"></i>
              <span>All Notes</span>
            </div>
            <span class="badge" id="countAll">0</span>
          </li>
          <li class="nav-item" data-folder="air">
            <div class="nav-item-left">
              <i data-lucide="sparkles"></i>
              <span>Air Sketches</span>
            </div>
            <span class="badge" id="countAir">0</span>
          </li>
          <li class="nav-item" data-folder="quick">
            <div class="nav-item-left">
              <i data-lucide="file-text"></i>
              <span>Quick Notes</span>
            </div>
            <span class="badge" id="countQuick">0</span>
          </li>
        </ul>
      </nav>
    </aside>

    <!-- Notes List Column -->
    <section class="notes-panel" id="notesPanel" aria-label="Notes">
      <div class="notes-header">
        <div class="notes-header-top">
          <h2 class="notes-title">Notes</h2>
          <div class="notes-header-actions">
            <button class="notes-close" id="btnNotesClose" type="button" aria-label="Close notes">
              <i data-lucide="x"></i>
            </button>
            <button class="btn-new-note" id="btnNewNote" title="New Air Note" aria-label="New air note">+</button>
          </div>
        </div>
        <div class="search-box">
          <i data-lucide="search" class="search-icon"></i>
          <input type="text" id="searchInput" class="search-input" placeholder="Search notes...">
        </div>
      </div>

      <div class="notes-list" id="notesList">
        <!-- Rendered Note Items -->
      </div>
    </section>

    <button class="mobile-notes-scrim" id="mobileNotesScrim" type="button" aria-label="Close notes"></button>

    <!-- Main Editor & Air Drawing Canvas Area -->
    <main class="workspace">
      
      <!-- Top Action Toolbar -->
      <header class="toolbar">
        <div class="toolbar-left">
          <input type="text" id="noteTitleInput" class="title-input" value="Air Sketch #1" aria-label="Note title">
        </div>

        <div class="toolbar-controls" aria-label="Drawing controls">
          <div class="toolbar-center">
            <!-- Air Draw Cam Toggle -->
            <button class="btn-air-draw" id="btnAirDrawToggle" aria-label="Turn on Air Draw">
              <div class="status-pulse" id="airPulse"></div>
              <i data-lucide="camera"></i>
              <span id="airDrawLabel">Air Draw: OFF</span>
            </button>

            <!-- Drawing Tool Palette -->
            <div class="tool-palette">
              <button class="tool-btn active" data-tool="pen" title="Pen Tool" aria-label="Pen tool">
                <i data-lucide="pen-tool"></i>
              </button>
              <button class="tool-btn" data-tool="highlighter" title="Highlighter" aria-label="Highlighter">
                <i data-lucide="highlighter"></i>
              </button>
              <button class="tool-btn" data-tool="eraser" title="Eraser" aria-label="Eraser">
                <i data-lucide="eraser"></i>
              </button>

              <div class="color-picker-wrapper">
                <input type="color" id="brushColor" class="color-picker" value="#f5a623" aria-label="Brush color">
              </div>
            </div>
          </div>

          <div class="toolbar-right">
            <div class="history-actions">
              <button class="btn-action" id="btnUndo" title="Undo Stroke" aria-label="Undo stroke">
                <i data-lucide="undo-2"></i>
              </button>
              <button class="btn-action" id="btnRedo" title="Redo Stroke" aria-label="Redo stroke">
                <i data-lucide="redo-2"></i>
              </button>
            </div>

            <button class="mobile-more-trigger" id="btnMobileMore" type="button" aria-controls="mobileActionsMenu" aria-expanded="false" aria-label="More drawing actions">
              <i data-lucide="ellipsis"></i>
            </button>

            <div class="mobile-actions-menu" id="mobileActionsMenu">
              <label class="brush-size-control" for="brushSize">
                <span class="brush-size-label">Brush size</span>
                <input type="range" id="brushSize" min="2" max="36" value="5" aria-label="Brush size">
              </label>
              <button class="btn-action" id="btnClearCanvas" title="Clear Air Canvas" aria-label="Clear canvas">
                <i data-lucide="trash-2"></i><span>Clear</span>
              </button>
              <button class="btn-action" id="btnExportPNG" title="Export as PNG Image" aria-label="Export PNG">
                <i data-lucide="image"></i><span>Export PNG</span>
              </button>
              <button class="btn-action btn-export" id="btnExportPDF" title="Export as PDF Document" aria-label="Export PDF">
                <i data-lucide="file-down"></i><span>Export PDF</span>
              </button>
            </div>
          </div>
        </div>
      </header>

      <!-- Drawing Canvas Area -->
      <div class="editor-body">
        
        <div class="canvas-wrapper">
          <canvas id="sketchCanvas"></canvas>
        </div>

        <!-- Virtual Fingertip Air Drawing Cursor -->
        <div class="air-cursor" id="airCursor" aria-hidden="true"></div>

        <!-- Air Drawing Webcam Camera HUD Modal -->
        <div class="air-hud" id="airHud">
          <div class="hud-header">
            <span class="hud-title">
              <i data-lucide="video"></i> Hand Tracker
            </span>
            <button class="hud-close" id="btnHudClose">&times;</button>
          </div>

          <div class="video-container">
            <video id="webcamVideo" autoplay playsinline muted></video>
            <canvas id="trackingCanvas"></canvas>
          </div>

          <div class="hud-status">
            <span>Tracking State: <strong id="trackingState">Initializing...</strong></span>
            <span id="fpsCounter">30 FPS</span>
          </div>

          <div class="gesture-guide">
            <strong>🖐️ Air Gestures:</strong><br>
            • <strong>Index Finger Extended:</strong> Move pen in air<br>
            • <strong>Pinch Index & Thumb (or Hold):</strong> Draw stroke<br>
            • <strong>Release Pinch:</strong> Lift pen
          </div>
        </div>

        <!-- Floating Text Note Area for Hybrid Note-Taking -->
        <div class="text-editor-container">
          <button class="text-editor-header" id="btnTextEditorToggle" type="button" aria-controls="textEditor" aria-expanded="true">
            <span class="text-editor-heading"><i data-lucide="edit-3"></i> Text note</span>
            <i class="text-editor-chevron" data-lucide="chevron-up"></i>
          </button>
          <textarea id="textEditor" class="text-editor" placeholder="Type your ideas, thoughts, or transcribed text here..."></textarea>
        </div>

      </div>

    </main>

  </div>

  <script src="app.js"></script>
</body>
</html>
